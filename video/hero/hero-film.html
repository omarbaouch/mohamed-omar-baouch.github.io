<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hero — rendu hors ligne</title>
<!--
  Rendu hors ligne de la scène du hero (affiches du site, images du film de présentation).
  La scène elle-même est celle du site : src/js/modules/hero-scene.js.
  window.__frame(u, variant) rend l'avancement u ∈ [0, 1] et renvoie l'image WebP.
-->
<style>
@font-face { font-family: 'Instrument Sans'; src: url('/public/fonts/instrument-sans-var.woff2') format('woff2'); font-weight: 400 700; }
html,body{margin:0;background:#080e18}canvas{display:block}
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { createHeroScene } from '/src/js/modules/hero-scene.js';

const canvas = document.createElement('canvas');
document.body.append(canvas);
const hero = await createHeroScene({ canvas, atlasScale: 1 });
const out = document.createElement('canvas');
const ctx = out.getContext('2d');

window.__frame = (u, variant, quality = 0.8) => {
  const portrait = variant === 'mob';
  const [W, H] = portrait ? [720, 1280] : [1440, 810];
  hero.setSize(W, H, 1.5); // suréchantillonnage
  hero.render(u, 0, portrait);
  out.width = W; out.height = H;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, 0, 0, W, H);
  return out.toDataURL('image/webp', quality);
};
window.__anchors = () => ({});
window.__ready = true;
</script>
</body>
</html>
